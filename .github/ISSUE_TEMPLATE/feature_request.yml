name: 功能请求
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请说明需求背景，帮助我们判断优先级。
  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 这个功能解决什么问题？现在的痛点是什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望如何实现？理想的行为是什么？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他替代方案？
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 相关截图、参考链接或其他说明。
