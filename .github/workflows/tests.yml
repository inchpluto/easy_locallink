name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The test suite is stdlib-only: no pytest, no PySide6.  Tests that need
      # the Qt packaging runtime skip themselves when it is absent.
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  web-ui:
    name: Frontend models (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Connection state machine
        run: node tests/connection_state.test.mjs
      - name: Web UI model
        run: node tests/web_ui.test.mjs

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      # ubuntu-latest images ship the Android SDK; no setup-android action.
      # The project has no Gradle wrapper, so the preinstalled gradle is used.
      - name: Android SDK environment
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          command -v sdkmanager || echo "sdkmanager not on PATH"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" 2>/dev/null || echo "no platforms dir"
          gradle --version
          # Annotations are readable through the API even when the raw log
          # endpoint is unavailable, so surface the toolchain here too.
          echo "::warning title=Android toolchain::ANDROID_HOME=${ANDROID_HOME:-unset} platforms=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" 2>/dev/null | tr '\n' ',' ) gradle=$(gradle --version 2>/dev/null | awk '/^Gradle /{print $2}')"
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      # Publish test results as annotations: the raw log endpoint can be
      # unreachable, and a silent red Android job is worse than no job.
      - name: Report test results
        if: always()
        run: |
          find . -path '*/test-results/*' -name '*.xml' -print
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = sorted(glob.glob('**/test-results/**/*.xml', recursive=True))
          if not files:
              print('::error title=Android tests produced no results::gradle never reached the test phase')
          total = failed = 0
          for path in files:
              suite = ET.parse(path).getroot()
              for case in suite.iter('testcase'):
                  total += 1
                  for problem in list(case):
                      if problem.tag in ('failure', 'error'):
                          failed += 1
                          text = (problem.get('message') or problem.text or '').strip().splitlines()
                          detail = text[0] if text else 'no message'
                          print(f"::error title=Android test failed::{case.get('classname')} {case.get('name')}: {detail}")
          if files:
              print(f'::warning title=Android unit tests::ran={total} failed={failed}')
          PY
