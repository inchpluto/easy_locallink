name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The test suite is stdlib-only: no pytest, no PySide6.  Tests that need
      # the Qt packaging runtime skip themselves when it is absent.
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  web-ui:
    name: Frontend models (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Connection state machine
        run: node tests/connection_state.test.mjs
      - name: Web UI model
        run: node tests/web_ui.test.mjs

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
