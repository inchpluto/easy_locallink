plugins { id 'com.android.application' }

android {
    namespace 'app.locallink.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'app.locallink.mobile'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '2.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.assets.srcDirs += ['../../locallink/static']
    }
}
