plugins { id 'com.android.application' }

android {
    namespace 'app.locallink.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'app.locallink.mobile'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '2.4.4'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.assets.srcDirs += ['../../locallink/static']
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    // Unit tests run against the stubbed android.jar, where org.json methods
    // throw "not mocked".  A real org.json on the test classpath shadows it.
    testImplementation 'org.json:json:20240303'
}
